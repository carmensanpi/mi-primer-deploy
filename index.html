<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Mi primer juego</title>
<style>
  :root {
    --sky-top: #8ec9f0;
    --sky-bottom: #d6f0ff;
    --ground: #5ec45e;
    --ground-dark: #46a046;
    --panel: #ffffff;
    --text: #2b2b40;
    --accent: #ff6b6b;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    height: 100%;
    background: linear-gradient(180deg, #cfe8ff, #f0f9ff);
    font-family: "Trebuchet MS", "Segoe UI", sans-serif;
    color: var(--text);
    display: flex;
    align-items: center;
    justify-content: center;
    touch-action: manipulation;
    -webkit-tap-highlight-color: transparent;
  }
  .wrap {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 10px;
    padding: 16px;
    width: 100%;
    max-width: 640px;
  }
  h1 {
    margin: 0;
    font-size: 1.8rem;
    background: linear-gradient(90deg, #ff6b6b, #ffa94d, #4dabf7);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    text-align: center;
  }
  .instructions {
    margin: 0 0 4px 0;
    font-size: 0.95rem;
    color: #555;
    text-align: center;
  }
  .board {
    position: relative;
    width: 100%;
    aspect-ratio: 2 / 1;
    background: var(--panel);
    border-radius: 16px;
    box-shadow: 0 10px 25px rgba(0,0,0,0.15);
    overflow: hidden;
  }
  canvas {
    display: block;
    width: 100%;
    height: 100%;
  }
  .footer-note {
    font-size: 0.8rem;
    color: #888;
  }
</style>
</head>
<body>
  <div class="wrap">
    <h1>Mi primer juego</h1>
    <p class="instructions">Toca la pantalla o presiona espacio para saltar</p>
    <div class="board">
      <canvas id="game" width="600" height="300"></canvas>
    </div>
    <p class="footer-note">Esquiva los obstáculos y consigue la mayor puntuación posible 🚀</p>
  </div>

<script>
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');

  const W = canvas.width;
  const H = canvas.height;
  const GROUND_Y = H - 50;

  const player = {
    x: 70,
    y: GROUND_Y,
    width: 34,
    height: 44,
    vy: 0,
    onGround: true
  };

  const GRAVITY = 0.75;
  const JUMP_FORCE = -12.5;

  let obstacles = [];
  let speed = 5;
  let score = 0;
  let frame = 0;
  let nextObstacleIn = 70;
  let gameOver = false;
  let started = false;
  let eatEffects = [];

  const flies = [];
  for (let i = 0; i < 5; i++) {
    flies.push({
      x: Math.random() * W,
      y: 35 + Math.random() * 90,
      phase: Math.random() * Math.PI * 2,
      speed: 0.3 + Math.random() * 0.4
    });
  }

  function resetGame() {
    player.y = GROUND_Y;
    player.vy = 0;
    player.onGround = true;
    obstacles = [];
    speed = 5;
    score = 0;
    frame = 0;
    nextObstacleIn = 70;
    gameOver = false;
    started = true;
    eatEffects = [];
  }

  function jump() {
    if (gameOver) {
      resetGame();
      return;
    }
    if (!started) {
      started = true;
    }
    if (player.onGround) {
      player.vy = JUMP_FORCE;
      player.onGround = false;
      eatEffects.push({ x: player.x + 30, y: player.y - 12, t: 0 });
    }
  }

  function spawnObstacle() {
    const colors = ['#ff6b6b', '#845ef7', '#20c997', '#ff922b'];
    const h = 30 + Math.random() * 30;
    obstacles.push({
      x: W + 10,
      y: GROUND_Y - h + 40,
      width: 18 + Math.random() * 14,
      height: h,
      color: colors[Math.floor(Math.random() * colors.length)]
    });
  }

  function rectsCollide(a, b) {
    return a.x < b.x + b.width &&
           a.x + a.width > b.x &&
           a.y < b.y + b.height &&
           a.y + a.height > b.y;
  }

  function drawBackground() {
    const sky = ctx.createLinearGradient(0, 0, 0, H);
    sky.addColorStop(0, '#8ec9f0');
    sky.addColorStop(1, '#eaf7ff');
    ctx.fillStyle = sky;
    ctx.fillRect(0, 0, W, H);

    ctx.fillStyle = 'rgba(255,255,255,0.85)';
    ctx.beginPath();
    ctx.arc(60, 50, 22, 0, Math.PI * 2);
    ctx.fill();
    ctx.beginPath();
    ctx.arc(150, 70, 16, 0, Math.PI * 2);
    ctx.fill();

    ctx.fillStyle = '#ffd43b';
    ctx.beginPath();
    ctx.arc(W - 60, 45, 24, 0, Math.PI * 2);
    ctx.fill();

    ctx.fillStyle = '#46a046';
    ctx.fillRect(0, GROUND_Y + 40, W, H - (GROUND_Y + 40));
    ctx.fillStyle = '#5ec45e';
    ctx.fillRect(0, GROUND_Y + 36, W, 10);

    ctx.strokeStyle = 'rgba(0,0,0,0.08)';
    ctx.lineWidth = 2;
    const stripeOffset = (frame * speed) % 40;
    for (let x = -stripeOffset; x < W; x += 40) {
      ctx.beginPath();
      ctx.moveTo(x, GROUND_Y + 40);
      ctx.lineTo(x - 10, H);
      ctx.stroke();
    }
  }

  function drawFrog() {
    const legSwing = player.onGround ? Math.sin(frame * 0.4) * 10 : 0;
    const px = player.x;
    const py = player.y;

    ctx.strokeStyle = '#2b8a3e';
    ctx.lineWidth = 4;
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(px + 17, py + 26);
    ctx.lineTo(px + 17 - legSwing, py + 44);
    ctx.moveTo(px + 17, py + 26);
    ctx.lineTo(px + 17 + legSwing, py + 44);
    ctx.stroke();

    ctx.fillStyle = '#2b8a3e';
    ctx.beginPath();
    ctx.ellipse(px + 17 - legSwing, py + 45, 5, 2.5, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.beginPath();
    ctx.ellipse(px + 17 + legSwing, py + 45, 5, 2.5, 0, 0, Math.PI * 2);
    ctx.fill();

    ctx.fillStyle = '#51cf66';
    ctx.beginPath();
    ctx.ellipse(px + 17, py + 14, 18, 15, 0, 0, Math.PI * 2);
    ctx.fill();

    ctx.fillStyle = '#d8f5a2';
    ctx.beginPath();
    ctx.ellipse(px + 17, py + 20, 11, 8, 0, 0, Math.PI * 2);
    ctx.fill();

    ctx.fillStyle = '#51cf66';
    ctx.beginPath();
    ctx.arc(px + 9, py - 2, 7, 0, Math.PI * 2);
    ctx.fill();
    ctx.beginPath();
    ctx.arc(px + 25, py - 2, 7, 0, Math.PI * 2);
    ctx.fill();

    ctx.fillStyle = '#ffffff';
    ctx.beginPath();
    ctx.arc(px + 9, py - 2, 4, 0, Math.PI * 2);
    ctx.fill();
    ctx.beginPath();
    ctx.arc(px + 25, py - 2, 4, 0, Math.PI * 2);
    ctx.fill();

    ctx.fillStyle = '#2b2b40';
    ctx.beginPath();
    ctx.arc(px + 10, py - 2, 1.8, 0, Math.PI * 2);
    ctx.fill();
    ctx.beginPath();
    ctx.arc(px + 26, py - 2, 1.8, 0, Math.PI * 2);
    ctx.fill();

    ctx.strokeStyle = '#1b5e2a';
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.arc(px + 17, py + 10, 7, 0.15 * Math.PI, 0.85 * Math.PI);
    ctx.stroke();
  }

  function drawPlants() {
    const spacing = 90;
    const offset = (frame * speed) % spacing;
    for (let x = W + spacing - offset; x > -spacing; x -= spacing) {
      drawPlant(x, GROUND_Y + 40);
    }
  }

  function drawPlant(x, baseY) {
    ctx.strokeStyle = '#2f9e44';
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.moveTo(x, baseY);
    ctx.lineTo(x, baseY - 18);
    ctx.stroke();

    ctx.fillStyle = '#51cf66';
    ctx.beginPath();
    ctx.ellipse(x - 6, baseY - 14, 7, 4, Math.PI / 4, 0, Math.PI * 2);
    ctx.fill();
    ctx.beginPath();
    ctx.ellipse(x + 6, baseY - 20, 7, 4, -Math.PI / 4, 0, Math.PI * 2);
    ctx.fill();

    ctx.fillStyle = '#ffa8c5';
    ctx.beginPath();
    ctx.arc(x, baseY - 24, 3.5, 0, Math.PI * 2);
    ctx.fill();
  }

  function drawFly(x, y, scale) {
    ctx.fillStyle = '#2b2b40';
    ctx.beginPath();
    ctx.ellipse(x, y, 3 * scale, 2.2 * scale, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = 'rgba(255,255,255,0.8)';
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(x - 2 * scale, y - 2 * scale);
    ctx.lineTo(x - 6 * scale, y - 5 * scale);
    ctx.moveTo(x + 2 * scale, y - 2 * scale);
    ctx.lineTo(x + 6 * scale, y - 5 * scale);
    ctx.stroke();
  }

  function drawFlies() {
    flies.forEach(f => {
      f.phase += 0.08;
      f.x -= f.speed;
      if (f.x < -10) f.x = W + 10;
      drawFly(f.x, f.y + Math.sin(f.phase) * 6, 1);
    });
  }

  function drawEatEffects() {
    eatEffects.forEach(e => {
      e.t++;
      const progress = e.t / 16;
      const scale = Math.max(0, 1 - progress);
      ctx.save();
      ctx.globalAlpha = scale;
      drawFly(e.x, e.y - progress * 10, scale);
      ctx.restore();
    });
    eatEffects = eatEffects.filter(e => e.t < 16);
  }

  function drawObstacles() {
    obstacles.forEach(o => {
      ctx.fillStyle = o.color;
      ctx.beginPath();
      ctx.moveTo(o.x, o.y + o.height);
      ctx.lineTo(o.x + o.width / 2, o.y);
      ctx.lineTo(o.x + o.width, o.y + o.height);
      ctx.closePath();
      ctx.fill();
    });
  }

  function drawScore() {
    ctx.fillStyle = '#2b2b40';
    ctx.font = 'bold 20px Trebuchet MS, sans-serif';
    ctx.textAlign = 'left';
    ctx.fillText('Puntos: ' + score, 16, 28);
  }

  function drawStartMessage() {
    ctx.fillStyle = 'rgba(0,0,0,0.35)';
    ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = '#fff';
    ctx.textAlign = 'center';
    ctx.font = 'bold 24px Trebuchet MS, sans-serif';
    ctx.fillText('¡Listo para saltar!', W / 2, H / 2 - 10);
    ctx.font = '16px Trebuchet MS, sans-serif';
    ctx.fillText('Toca o presiona espacio para empezar', W / 2, H / 2 + 20);
  }

  function drawGameOver() {
    ctx.fillStyle = 'rgba(0,0,0,0.45)';
    ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = '#fff';
    ctx.textAlign = 'center';
    ctx.font = 'bold 30px Trebuchet MS, sans-serif';
    ctx.fillText('Game Over', W / 2, H / 2 - 20);
    ctx.font = 'bold 18px Trebuchet MS, sans-serif';
    ctx.fillText('Puntuación: ' + score, W / 2, H / 2 + 10);
    ctx.font = '15px Trebuchet MS, sans-serif';
    ctx.fillText('Toca o presiona espacio para reintentar', W / 2, H / 2 + 38);
  }

  function update() {
    frame++;

    player.vy += GRAVITY;
    player.y += player.vy;
    if (player.y >= GROUND_Y) {
      player.y = GROUND_Y;
      player.vy = 0;
      player.onGround = true;
    }

    nextObstacleIn--;
    if (nextObstacleIn <= 0) {
      spawnObstacle();
      const minGap = 45 + speed * 3;
      nextObstacleIn = minGap + Math.random() * 50;
    }

    obstacles.forEach(o => { o.x -= speed; });
    obstacles = obstacles.filter(o => o.x + o.width > -5);

    const playerBox = {
      x: player.x,
      y: player.y - 22,
      width: player.width,
      height: player.height
    };

    for (const o of obstacles) {
      if (rectsCollide(playerBox, o)) {
        gameOver = true;
      }
    }

    if (!gameOver) {
      score++;
      speed = 5 + Math.floor(score / 300) * 0.8;
    }
  }

  function loop() {
    drawBackground();
    drawPlants();
    drawFlies();
    drawObstacles();
    drawFrog();
    drawEatEffects();
    drawScore();

    if (!started) {
      drawStartMessage();
    } else if (gameOver) {
      drawGameOver();
    } else {
      update();
    }

    requestAnimationFrame(loop);
  }

  window.addEventListener('keydown', (e) => {
    if (e.code === 'Space') {
      e.preventDefault();
      jump();
    }
  });
  canvas.addEventListener('mousedown', jump);
  canvas.addEventListener('touchstart', (e) => {
    e.preventDefault();
    jump();
  }, { passive: false });

  requestAnimationFrame(loop);
</script>
</body>
</html>
